  .eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1s ease-in-out infinite alternate}
  @keyframes eq{0%{transform:scaleY(.15)}100%{transform:scaleY(1)}}
  .s0{animation:fall0 18s linear infinite}@keyframes fall0{from{transform:translateY(-250px)}to{transform:translateY(0)}}.w0{animation:sway0 10.8s ease-in-out infinite alternate}@keyframes sway0{from{transform:translateX(-6px)}to{transform:translateX(6px)}}.s1{animation:fall1 12s linear infinite}@keyframes fall1{from{transform:translateY(-250px)}to{transform:translateY(0)}}.w1{animation:sway1 7.2s ease-in-out infinite alternate}@keyframes sway1{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
