<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 250" width="1180" height="250" role="img" aria-label="Harmony — An offline music player with a cinematic live-stage visualizer — six Show Packs, a custom Web Audio engine (10-band EQ, crossfade, gapless) and synced + karaoke lyrics. Open source (MIT). Runs on Windows and Linux.">
<title>Harmony</title>
